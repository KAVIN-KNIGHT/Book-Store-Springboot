<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
    <title>Login - BookStore</title>
    <link rel="stylesheet" href="/css/components/variables.css">
    <link rel="stylesheet" href="/css/components/base.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/auth-enhanced.css">
    <link rel="stylesheet" href="/css/footer.css">
</head>
<body>
    <div th:insert="~{fragments/header :: header}"></div>

    <main class="container">
        <div class="form-container">
            <h2>Welcome Back!</h2>
            <p class="text-muted">Sign in to continue to BookStore</p>

            <div th:if="${param.success}" class="alert alert-success">
                Registration successful! Please login with your credentials.
            </div>
            
            <div th:if="${success}" class="alert alert-success" th:text="${success}">
                Success!
            </div>

            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
            
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out successfully.
            </div>

            <form th:action="@{/login}" method="post" class="auth-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" 
                           id="username" 
                           name="username" 
                           class="form-control" 
                           required 
                           autofocus>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" 
                           id="password" 
                           name="password" 
                           class="form-control" 
                           required>
                </div>

                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember-me"> Remember me
                        <span class="checkmark"></span>
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </div>
            </form>

            <div class="auth-links">
                <p>Don't have an account? <a th:href="@{/register}">Register here</a></p>
                <p><a th:href="@{/forgot-password}">Forgot your password?</a></p>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
