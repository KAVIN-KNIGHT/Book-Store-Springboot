<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Manage Books | Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/components/header.css">
    <link rel="stylesheet" href="/css/components/footer.css">
    <link rel="stylesheet" href="/css/components/buttons.css">
    <link rel="stylesheet" href="/css/components/forms.css">
    <link rel="stylesheet" href="/css/components/books.css">
    <link rel="stylesheet" href="/css/components/admin.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div th:insert="~{fragments/header :: header}"></div>

    <main class="container">
        <div class="admin-dashboard">
            <h1 class="admin-title">Manage Books</h1>
            <p class="admin-subtitle">Add, edit, or remove books from your inventory</p>
            
            <div class="admin-form">
                <h2>Add New Book</h2>
                <form th:action="@{/admin/books/add}" method="post">
                    <div class="admin-form-row">
                        <div class="form-group">
                            <label for="title">Book Title</label>
                            <input type="text" id="title" name="title" placeholder="Enter book title" required />
                        </div>
                        <div class="form-group">
                            <label for="author">Author</label>
                            <input type="text" id="author" name="author" placeholder="Enter author name" required />
                        </div>
                        <div class="form-group">
                            <label for="price">Price ($)</label>
                            <input type="number" id="price" step="0.01" name="price" placeholder="0.00" required />
                        </div>
                    </div>
                    <div class="admin-form-row">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category">
                                <option value="fiction">Fiction</option>
                                <option value="non-fiction">Non-Fiction</option>
                                <option value="science">Science</option>
                                <option value="history">History</option>
                                <option value="biography">Biography</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="isbn">ISBN</label>
                            <input type="text" id="isbn" name="isbn" placeholder="ISBN number" />
                        </div>
                        <div class="form-group">
                            <label for="stock">Stock Quantity</label>
                            <input type="number" id="stock" name="stock" placeholder="0" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" placeholder="Enter book description"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="image">Cover Image URL</label>
                        <input type="text" id="image" name="imageUrl" placeholder="https://example.com/book-cover.jpg" />
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-primary" type="submit">
                            <span class="material-icons">add</span>
                            Add Book
                        </button>
                        <button class="btn btn-outline" type="reset">Clear Form</button>
                    </div>
                </form>
            </div>
            
            <div class="admin-recent-section">
                <div class="section-header">
                    <h2>Book Inventory</h2>
                    <div class="search-filter">
                        <input type="text" placeholder="Search books..." class="search-input" />
                    </div>
                </div>
                
                <div class="admin-table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="book, status : ${books}">
                                <td th:text="${book.id}">1</td>
                                <td th:text="${book.title}">Book Title</td>
                                <td th:text="${book.author}">Author Name</td>
                                <td th:text="${book.category != null ? book.category : 'Uncategorized'}">Fiction</td>
                                <td>$<span th:text="${#numbers.formatDecimal(book.price, 1, 2)}">19.99</span></td>
                                <td th:text="${book.stock != null ? book.stock : 'N/A'}">15</td>
                                <td>
                                    <div class="table-actions">
                                        <a th:href="@{/admin/books/edit/{id}(id=${book.id})}" class="action-icon" title="Edit">
                                            <span class="material-icons">edit</span>
                                        </a>
                                        <a th:href="@{/admin/books/delete/{id}(id=${book.id})}" 
                                           onclick="return confirm('Are you sure you want to delete this book?')" 
                                           class="action-icon delete" title="Delete">
                                            <span class="material-icons">delete</span>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                            <!-- Empty state message if no books -->
                            <tr th:if="${#lists.isEmpty(books)}">
                                <td colspan="7" class="empty-state">
                                    <span class="material-icons">book</span>
                                    <p>No books in inventory. Add your first book above!</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:insert="~{fragments/footer :: footer}"></div>
    
    <script>
        // Simple client-side filtering for the book table
        document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.querySelector('.search-input');
            if (searchInput) {
                searchInput.addEventListener('input', function() {
                    const searchTerm = this.value.toLowerCase();
                    const tableRows = document.querySelectorAll('.admin-table tbody tr');
                    
                    tableRows.forEach(row => {
                        if (row.classList.contains('empty-state')) return;
                        
                        const title = row.cells[1].textContent.toLowerCase();
                        const author = row.cells[2].textContent.toLowerCase();
                        const category = row.cells[3].textContent.toLowerCase();
                        
                        if (title.includes(searchTerm) || author.includes(searchTerm) || category.includes(searchTerm)) {
                            row.style.display = '';
                        } else {
                            row.style.display = 'none';
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
